<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFR 烈焰升騰 - 事件圖片生成器</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(22, 24, 30, 0.88);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f7;
            --text-secondary: #9ba1a6;
            --accent-primary: #e53935;
            --accent-glow: rgba(229, 57, 53, 0.45);
            --accent-hover: #ff5252;
            --control-bg: #191c24;
            --control-border: #2e3342;
            --gold: #d4af37;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background: radial-gradient(circle at 50% 10%, #1f1113 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 40px rgba(229, 57, 53, 0.1);
            border-radius: 14px;
            padding: 32px 36px;
            max-width: 680px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding-bottom: 18px;
        }

        h1 {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            margin: 0 0 6px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 .badge {
            font-size: 11px;
            letter-spacing: 1.5px;
            padding: 2px 8px;
            background: rgba(229, 57, 53, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(229, 57, 53, 0.4);
            border-radius: 4px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .status-msg {
            text-align: center;
            font-size: 12.5px;
            margin-bottom: 18px;
            padding: 7px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
        }

        .dropzone {
            width: 100%;
            border: 2px dashed var(--control-border);
            border-radius: 10px;
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            background: rgba(0, 0, 0, 0.2);
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: var(--accent-primary);
            background: rgba(229, 57, 53, 0.05);
        }

        .dropzone-text {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 4px;
        }

        .dropzone-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="file"] {
            display: none;
        }

        .canvas-card {
            background: #000;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
            position: relative;
        }

        .canvas-inner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background: radial-gradient(#1c1e24 0%, #0d0e12 100%);
            touch-action: none;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            cursor: default;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        }

        canvas.draggable {
            cursor: grab;
        }

        canvas.dragging {
            cursor: grabbing;
        }

        .hint-text {
            font-size: 11.5px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        .controls-panel {
            background: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 540px) {
            .controls-panel {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .control-val {
            color: #fff;
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #2a2e3d;
            border-radius: 3px;
            outline: none;
            margin: 4px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-primary);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-glow);
            transition: transform 0.1s, background-color 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--accent-hover);
        }

        .btn-row {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 2px;
        }

        .btn-small {
            background: #272b38;
            border: 1px solid #3c4257;
            color: var(--text-primary);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn-small:hover {
            background: #33384a;
            border-color: #555d78;
        }

        .btn-small.btn-accent {
            border-color: rgba(229, 57, 53, 0.4);
            color: #ff8a80;
        }

        .btn-small.btn-accent:hover {
            background: rgba(229, 57, 53, 0.15);
            border-color: var(--accent-primary);
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #b71c1c 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 7px;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.35);
        }

        .download-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--accent-hover) 0%, #c62828 100%);
            box-shadow: 0 6px 22px rgba(229, 57, 53, 0.5);
            transform: translateY(-1px);
        }

        .download-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .download-btn:disabled {
            background: #252830;
            color: #636b78;
            box-shadow: none;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #555a64;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>TFR 烈焰升騰 <span class="badge">OIOD</span></h1>
            <p class="subtitle">事件圖片生成器 • 支援縮放、拖曳、色差與遮罩合成</p>
        </header>

        <div class="status-msg" id="overlayStatus">正在檢查系統遮罩...</div>

        <div class="upload-section">
            <label for="imageInput" class="dropzone" id="dropZone">
                <div class="dropzone-text" id="uploadPrompt">點擊或拖曳原圖至此處</div>
                <div class="dropzone-sub" id="imageName">支援 JPG, PNG, WEBP, DDS 等格式</div>
                <input type="file" id="imageInput" accept="image/*" disabled>
            </label>
        </div>

        <div class="canvas-card">
            <div class="canvas-inner">
                <canvas id="resultCanvas" width="500" height="250"></canvas>
            </div>
        </div>
        <div class="hint-text" id="canvasHint">💡 提示：在畫布上可直接用滑鼠滾輪縮放、按住滑鼠左鍵拖曳調整位置</div>

        <div class="controls-panel">
            <div class="control-group">
                <div class="control-label-row">
                    <span>圖片縮放 (Zoom)</span>
                    <span class="control-val" id="scaleVal">100%</span>
                </div>
                <input type="range" id="scaleSlider" min="20" max="300" value="100" disabled>
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <span>色差位移 (Aberration)</span>
                    <span class="control-val" id="aberrationVal">3px</span>
                </div>
                <input type="range" id="aberrationSlider" min="0" max="15" value="3">
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <span>水平位移 (X)</span>
                    <span class="control-val" id="panXVal">0px</span>
                </div>
                <input type="range" id="panXSlider" min="-300" max="300" value="0" disabled>
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <span>垂直位移 (Y)</span>
                    <span class="control-val" id="panYVal">0px</span>
                </div>
                <input type="range" id="panYSlider" min="-200" max="200" value="0" disabled>
            </div>

            <div class="btn-row">
                <button type="button" class="btn-small" id="fitCoverBtn" disabled>適應填滿</button>
                <button type="button" class="btn-small" id="fitContainBtn" disabled>適應完整</button>
                <button type="button" class="btn-small" id="resetPositionBtn" disabled>重置位置</button>
                <button type="button" class="btn-small btn-accent" id="resetAllBtn" disabled>全部重置</button>
            </div>
        </div>

        <button id="downloadBtn" class="download-btn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            下載事件圖片 (PNG)
        </button>

        <div class="footer">The Fire Rises: One Island, One Determination Modding Tool</div>
    </div>

        overlayImg.onload = function () {
            overlayLoaded = true;
            overlayStatus.style.borderColor = 'rgba(76, 175, 80, 0.4)';
            overlayStatus.style.background = 'rgba(76, 175, 80, 0.1)';
            overlayStatus.style.color = '#81c784';
            overlayStatus.textContent = '✅ 系統遮罩載入成功（' + overlayImg.width + '×' + overlayImg.height + '），可以開始上傳原圖。';
            imageInput.disabled = false;
            dropZone.style.cursor = 'pointer';

            resultCanvas.width = overlayImg.width;
            resultCanvas.height = overlayImg.height;

            // Draw initial placeholder
            drawPlaceholder();

            if (sourceLoaded) {
                initImagePlacement();
                processImage();
            }
        };

        overlayImg.onerror = function () {
            overlayStatus.style.borderColor = 'rgba(244, 67, 54, 0.4)';
            overlayStatus.style.background = 'rgba(244, 67, 54, 0.1)';
            overlayStatus.style.color = '#e57373';
            overlayStatus.textContent = '❌ 錯誤：找不到 event_pic_overlay.png，請確認檔案位於同一目錄。';
        };

        function drawPlaceholder() {
            const w = resultCanvas.width;
            const h = resultCanvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#14161c';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#2a2e3d';
            ctx.lineWidth = 1;
            ctx.strokeRect(10, 10, w - 20, h - 20);

            ctx.fillStyle = '#4f5568';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('請上傳圖片以即時預覽', w / 2, h / 2);

            if (overlayLoaded) {
                ctx.drawImage(overlayImg, 0, 0, w, h);
            }
        }

        function readImage(file, imgObj, callback) {
            const reader = new FileReader();
            reader.onload = function (e) {
                imgObj.onload = callback;
                imgObj.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            uploadPrompt.textContent = "已載入：" + file.name;
            imageName.textContent = Math.round(file.size / 1024) + " KB • 點擊可重新選擇";
            readImage(file, sourceImg, () => {
                sourceLoaded = true;
                enableControls();
                initImagePlacement();
                processImage();
            });
        }

        imageInput.addEventListener('change', function (e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag and drop support
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function enableControls() {
            scaleSlider.disabled = false;
            panXSlider.disabled = false;
            panYSlider.disabled = false;
            resetPositionBtn.disabled = false;
            resetAllBtn.disabled = false;
            fitCoverBtn.disabled = false;
            fitContainBtn.disabled = false;
            resultCanvas.classList.add('draggable');
        }

        function initImagePlacement(mode = 'cover') {
            const targetW = overlayImg.width || 500;
            const targetH = overlayImg.height || 250;

            if (mode === 'cover') {
                baseScale = Math.max(targetW / sourceImg.width, targetH / sourceImg.height);
            } else {
                baseScale = Math.min(targetW / sourceImg.width, targetH / sourceImg.height);
            }

            currentZoom = 1;
            panX = 0;
            panY = 0;

            updateSliderRanges();
            syncControls();
        }

        function updateSliderRanges() {
            const targetW = overlayImg.width || 500;
            const targetH = overlayImg.height || 250;
            const currentDrawW = sourceImg.width * baseScale * currentZoom;
            const currentDrawH = sourceImg.height * baseScale * currentZoom;

            const maxPanX = Math.max(Math.round(targetW * 0.8), Math.round(currentDrawW / 2));
            const maxPanY = Math.max(Math.round(targetH * 0.8), Math.round(currentDrawH / 2));

            panXSlider.min = -maxPanX;
            panXSlider.max = maxPanX;
            panYSlider.min = -maxPanY;
            panYSlider.max = maxPanY;
        }

        function syncControls() {
            scaleSlider.value = Math.round(currentZoom * 100);
            scaleVal.textContent = Math.round(currentZoom * 100) + '%';

            panXSlider.value = Math.round(panX);
            panXVal.textContent = Math.round(panX) + 'px';

            panYSlider.value = Math.round(panY);
            panYVal.textContent = Math.round(panY) + 'px';

            aberrationSlider.value = aberrationOffset;
            aberrationVal.textContent = aberrationOffset + 'px';
        }

        scaleSlider.addEventListener('input', function () {
            currentZoom = parseFloat(this.value) / 100;
            scaleVal.textContent = Math.round(currentZoom * 100) + '%';
            updateSliderRanges();
            processImage();
        });

        panXSlider.addEventListener('input', function () {
            panX = parseFloat(this.value);
            panXVal.textContent = Math.round(panX) + 'px';
            processImage();
        });

        panYSlider.addEventListener('input', function () {
            panY = parseFloat(this.value);
            panYVal.textContent = Math.round(panY) + 'px';
            processImage();
        });

        aberrationSlider.addEventListener('input', function () {
            aberrationOffset = parseInt(this.value, 10);
            aberrationVal.textContent = aberrationOffset + 'px';
            processImage();
        });

        resetPositionBtn.addEventListener('click', function () {
            panX = 0;
            panY = 0;
            updateSliderRanges();
            syncControls();
            processImage();
        });

        resetAllBtn.addEventListener('click', function () {
            currentZoom = 1;
            panX = 0;
            panY = 0;
            aberrationOffset = 3;
            updateSliderRanges();
            syncControls();
            processImage();
        });

        fitCoverBtn.addEventListener('click', function () {
            initImagePlacement('cover');
            processImage();
        });

        fitContainBtn.addEventListener('click', function () {
            initImagePlacement('contain');
            processImage();
        });

        // Mouse Wheel Zoom on Canvas
        resultCanvas.addEventListener('wheel', function (e) {
            if (!sourceLoaded) return;
            e.preventDefault();

            const zoomDelta = e.deltaY < 0 ? 0.08 : -0.08;
            const newZoom = Math.min(Math.max(0.2, currentZoom + zoomDelta), 3.0);

            if (newZoom !== currentZoom) {
                currentZoom = newZoom;
                updateSliderRanges();
                syncControls();
                processImage();
            }
        }, { passive: false });

        // Drag to Pan on Canvas
        function getEventPos(e) {
            const rect = resultCanvas.getBoundingClientRect();
            const scaleCanvasX = resultCanvas.width / rect.width;
            const scaleCanvasY = resultCanvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleCanvasX,
                y: (clientY - rect.top) * scaleCanvasY
            };
        }

        function onDragStart(e) {
            if (!sourceLoaded) return;
            isDragging = true;
            resultCanvas.classList.remove('draggable');
            resultCanvas.classList.add('dragging');

            const pos = getEventPos(e);
            dragStartX = pos.x;
            dragStartY = pos.y;
            dragStartPanX = panX;
            dragStartPanY = panY;
        }

        function onDragMove(e) {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();

            const pos = getEventPos(e);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;

            panX = dragStartPanX + dx;
            panY = dragStartPanY + dy;

            syncControls();
            processImage();
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            resultCanvas.classList.remove('dragging');
            resultCanvas.classList.add('draggable');
            updateSliderRanges();
        }

        resultCanvas.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);

        resultCanvas.addEventListener('touchstart', onDragStart, { passive: true });
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);

        function processImage() {
            if (!overlayLoaded || !sourceLoaded) return;

            const targetW = overlayImg.width;
            const targetH = overlayImg.height;

            resultCanvas.width = targetW;
            resultCanvas.height = targetH;

            const w = sourceImg.width * baseScale * currentZoom;
            const h = sourceImg.height * baseScale * currentZoom;
            const x = (targetW - w) / 2 + panX;
            const y = (targetH - h) / 2 + panY;

            ctx.clearRect(0, 0, targetW, targetH);
            // Fill background with black so empty frame areas match dark theme
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, targetW, targetH);

            // Draw transformed user image
            ctx.drawImage(sourceImg, x, y, w, h);

            // Chromatic aberration pass
            if (aberrationOffset > 0) {
                const imgData = ctx.getImageData(0, 0, targetW, targetH);
                const data = imgData.data;
                const outData = new Uint8ClampedArray(data.length);
                const offsetX = aberrationOffset;
                const offsetY = 0;

                for (let py = 0; py < targetH; py++) {
                    const rowStart = py * targetW;
                    for (let px = 0; px < targetW; px++) {
                        const currentIdx = (rowStart + px) * 4;

                        // Keep Red channel
                        outData[currentIdx] = data[currentIdx];

                        // Shift Green and Blue channels
                        const srcX = px - offsetX;
                        const srcY = py - offsetY;

                        if (srcX >= 0 && srcY >= 0 && srcX < targetW && srcY < targetH) {
                            const srcIdx = (srcY * targetW + srcX) * 4;
                            outData[currentIdx + 1] = data[srcIdx + 1]; // G
                            outData[currentIdx + 2] = data[srcIdx + 2]; // B
                        } else {
                            outData[currentIdx + 1] = data[currentIdx + 1];
                            outData[currentIdx + 2] = data[currentIdx + 2];
                        }

                        // Alpha
                        outData[currentIdx + 3] = data[currentIdx + 3];
                    }
                }

                const glitchedImageData = new ImageData(outData, targetW, targetH);
                ctx.putImageData(glitchedImageData, 0, 0);
            }

            // Overlay the frame
            ctx.drawImage(overlayImg, 0, 0, targetW, targetH);

            downloadBtn.disabled = false;
        }

        downloadBtn.addEventListener('click', function () {
            if (!downloadBtn.disabled) {
                // Hoi4 event pictures are saved as PNG
                const dataUrl = resultCanvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'TFR_Event_' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>

</html>
